# Publishes langchain-gnarl to PyPI when a `langchain-gnarl-v*` tag is pushed, e.g.
# `langchain-gnarl-v0.1.0`. Builds only python/langchain-gnarl.
#
# No token lives in this repository: PyPI trusts this workflow by name
# (trusted publishing). The one-time PyPI side: project langchain-gnarl, owner
# gnarl-dev, repository integrations, workflow release-langchain-gnarl.yml,
# environment pypi.
name: release langchain-gnarl

on:
  push:
    tags: ["langchain-gnarl-v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python/langchain-gnarl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag names the version being built
        run: |
          want="${GITHUB_REF_NAME#langchain-gnarl-v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $have"
            exit 1
          fi
      # The same gate as CI, so a tag cannot publish what main would refuse.
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: pyright
      - run: pytest tests/unit
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/langchain-gnarl/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
