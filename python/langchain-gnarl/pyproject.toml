[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-gnarl"
version = "0.1.0"
description = "LangChain and LangGraph integrations for Gnarl agent memory"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lucenia" }]
keywords = ["langchain", "langgraph", "memory", "agents", "gnarl", "vector-search"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
# Floors are the versions this package was built and verified against; ceilings
# are the next major, whose base classes may change shape.
dependencies = [
  "gnarl-client>=0.2.0,<0.3",
  "langchain-core>=1.6.9,<2",
  "langgraph-checkpoint>=4.2.0,<5",
  "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://gnarl.dev"
Documentation = "https://gnarl.dev/docs"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "mypy==2.4.0",
  "pyright==1.1.414",
  "ruff==0.17.0",
  # Only the integration test, which runs the store inside a real graph.
  "langgraph==1.2.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_gnarl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a live node at $GNARL_URL (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/langchain_gnarl"]

# gnarl-client 0.2.0 is fully annotated but ships no py.typed marker, so mypy
# would otherwise treat every gnarl type as Any.
[[tool.mypy.overrides]]
module = ["gnarl", "gnarl.*"]
follow_untyped_imports = true

[tool.pyright]
include = ["src"]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"
